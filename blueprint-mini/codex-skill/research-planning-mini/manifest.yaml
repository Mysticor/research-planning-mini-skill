  optional_modules:
  - requests
  - openpyxl
  - xlrd
  - pybliometrics
vendor_root: ../../vendor/nature-skills/skills
upstream_lock: ../../vendor/upstream-lock.json
python_vendor: ../../vendor/python

project_coordination:
  contract_version: "1.1"
  actor: research_planning
  helper: scripts/projectctl.py
  shared_contract: ../../../workflow-contract/README.md
