name: research-planning-mini
version: 1.0.0
entrypoint: SKILL.md
always_load:
- references/workflow.md
axes:
  study_type:
    detection: Agent classifies evidence logic, records rationale and confidence;
      no keyword-only final decision.
    values:
      ml-ai: references/study-types/ml-ai.md
      experimental: references/study-types/experimental.md
      simulation: references/study-types/simulation.md
      observational: references/study-types/observational.md
      engineering-method: references/study-types/engineering-method.md
      review: references/study-types/review.md
      mixed: references/study-types/mixed.md
    multi: true
phase_routes:
  '0':
  - references/user-decision-gates.md
  - references/literature-strategy.md
  '1':
  - references/literature-strategy.md
  - references/adapters.md
  '2':
  - references/deep-reading.md
  - references/literature-visual-evidence.md
  - references/adapters.md
  '3':
  - references/research-canon.md
  - references/novelty-analysis.md
  '4':
  - references/journal-strategy.md
  - references/user-decision-gates.md
  '5':
  - references/research-design.md
  - references/statistics-design.md
  - references/evidence-assets.md
  - references/reproducibility.md
  '6':
  - references/readiness-gates.md
  - references/user-decision-gates.md
  '7':
  - references/execution-tracking.md
  - references/evidence-assets.md
  '8':
  - references/execution-tracking.md
  - references/readiness-gates.md
  '9':
  - references/novelty-analysis.md
  - references/journal-strategy.md
  - references/adapters.md
  '10':
  - references/handoff-contract.md
  - references/readiness-gates.md
phases:
- IDEA & INTAKE
- LITERATURE DISCOVERY
- SCREENING & DEEP READING
- RESEARCH CANON / GAP / NOVELTY
- CANDIDATE ROUTES & JOURNAL STRATEGY
- DETAILED RESEARCH DESIGN
- PRE-EXECUTION REVIEW
- RESEARCH EXECUTION & EVIDENCE CAPTURE
- RESULTS / CLAIM-EVIDENCE CLOSURE
- NOVELTY & JOURNAL REFRESH
- MANUSCRIPT HANDOFF
